}

  :root:not([data-theme="light"]) {
    --bg: #0E1A1D; --surface: #152428; --surface-2: #1D3237;
    --ink: #E4EEEE; --ink-2: #B7C8CA; --muted: #8FA5A8; --line: #263A3E; --grid: #1F3135;
  --take-bg: #1F4A33; --take-line: #4FAE76; --take-ink: #D6F3E1; --rel-bg: #5A2C2C; --rel-line: #E27C7C; --rel-ink: #FADADA;
    --accent: #5CC0C9; --accent-ink: #0E1A1D; --accent-soft: #1B3A3F;
    --warn: #F0C060; --warn-bg: #3A2E10; --bad: #F28B8B; --bad-bg: #3D1A1A; --ok: #6CCB8B;
    --sp0: #3987e5; --sp1: #d95926; --sp2: #199e70; --sp3: #c98500;
    --sp4: #d55181; --sp5: #008300; --sp6: #9085e9; --sp7: #e66767;

}
:root[data-theme="dark"] {
  --bg: #0E1A1D; --surface: #152428; --surface-2: #1D3237;
  --ink: #E4EEEE; --ink-2: #B7C8CA; --muted: #8FA5A8; --line: #263A3E; --grid: #1F3135;

<script>
'use strict';
/* ===== Kern: Daten, Speicher, Hilfsfunktionen, Auswertung ===== */
const APP_VERSION = '2.0';
const APP_DATE = '10.11.2026, 15:31 Uhr';
const KEY = 'angelbuch.v1';
const WD = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const WD_S = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const WD_ORDER = [1, 2, 3, 4, 5, 6, 0]; // Woche beginnt am Montag
const MONTHS = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const MONTHS_L = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

/* Startlisten: Der Vater kann zu jeder Liste selbst neue Einträge anlegen. Namen von Personen stehen bewusst nicht hier. */
const SEED = {
  lakes: ['Krewitz', 'Oberuckersee', 'Unteruckersee', 'Sukow', 'Ostsee', 'Dänemark', 'Hardenbeck', 'Mellenau', 'Kuhz', 'Lanke', 'Rittgarten', 'Warbende', 'Bertikow'],
  baits: ['Blinker', 'Spinner', 'Jig Spinner', 'Gummifisch', 'Wobbler', 'Chatterbait', 'Crankbait', 'Hegene'],
  weathers: ['sonnig', 'bewölkt', 'Regen', 'Schnee', 'starker Wind', 'Nebel'],
  species: ['Hecht', 'Barsch', 'Zander', 'Hering', 'Sonstiges']

const TEMPS = ['kalt', 'kühl', 'mild', 'warm', 'heiß'];
const SIZES = [['k', 'klein'], ['m', 'mittel'], ['g', 'groß']];
const LISTKEY = { lake: 'lakes', bait: 'baits', weather: 'weathers', temp: 'temps' };

let store = null;
let memoryOnly = false;

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
function speciesObjs(names) { return names.map((name, i) => ({ name, c: name === 'Zander' ? 6 : i % 8 })); }
function freshStore() {
  return { v: 2, species: speciesObjs(SEED.species), lists: { lakes: [...SEED.lakes], baits: [...SEED.baits], weathers: [...SEED.weathers], temps: [...TEMPS] }, trips: [], lastBackup: null, firstRun: true };
}
function splitList(s) { return String(s || '').split(/[,;\/]+/).map(x => x.trim()).filter(Boolean); }
function mergeNames(base, extra) {
  const out = [], seen = new Set();
  for (const n of [...base, ...extra]) { const k = String(n).trim().toLowerCase(); if (k && !seen.has(k)) { seen.add(k); out.push(String(n).trim()); } }
  return out;
}
function normalizeTrip(t) {
  const o = { ...t };
  o.id = o.id || uid();
  o.fish = Array.isArray(o.fish) ? o.fish.filter(x => x && (x.l == null || Number.isFinite(x.l))).map(x => ({ ...x, l: Number.isFinite(x.l) ? x.l : null })) : [];
  o.comp = Array.isArray(o.comp) ? o.comp.filter(c => c && typeof c.name === 'string').map(c => { const r = { name: c.name, c: { ...(c.c || {}) } }; if (c.cs) r.cs = JSON.parse(JSON.stringify(c.cs)); return r; }) : [];
  o.baits = Array.isArray(o.baits) ? o.baits.filter(Boolean) : splitList(o.bait);
  o.weathers = Array.isArray(o.weathers) ? o.weathers.filter(Boolean) : splitList(o.weather);
  delete o.bait; delete o.weather;
  o.planned = o.planned === true;
  o.time = /^\d{1,2}:\d{2}$/.test(o.time || '') ? o.time : '';
  o.timeEnd = /^\d{1,2}:\d{2}$/.test(o.timeEnd || '') ? o.timeEnd : '';
  { const raw = Array.isArray(o.temps) ? o.temps : (o.temp ? [o.temp] : []); o.temps = [...new Set(raw.filter(x => typeof x === 'string' && x.trim()))]; delete o.temp; }
  return o;
}
/* Alte Stände (v1) und alte Sicherungen werden beim Laden auf das neue Format gebracht. */
/* Ziel prüfen und bereinigen: days/fish/len/wt mit Zielwert, optional See und Fischart; free = freier Text zum Abhaken */
const GOAL_TYPES = ['days', 'fish', 'len', 'wt', 'free'];
function normGoal(g) {
  if (!g || typeof g.year !== 'string' || !GOAL_TYPES.includes(g.type)) return null;
  const free = g.type === 'free', text = free ? String(g.text || '').trim().slice(0, 120) : '';
  if (free ? !text : !(Number(g.target) > 0)) return null;
  return { id: String(g.id || uid()), year: g.year, type: g.type, target: free ? 1 : Number(g.target), sp: !free && typeof g.sp === 'string' ? g.sp : '', lake: !free && typeof g.lake === 'string' ? g.lake : '', ...(free ? { text, done: !!g.done } : {}), ...(g.demo ? { demo: true } : {}) };
}
function migrateStore(s) {
  const old = !s.v || s.v < 2;
  s.trips = s.trips.map(normalizeTrip);
  s.trash = (s.trash || []).map(normalizeTrip);
  if (!Array.isArray(s.species) || !s.species.length) s.species = [];
  if (old) for (const n of SEED.species) if (!s.species.some(x => x.name.toLowerCase() === n.toLowerCase())) addSpeciesTo(s.species, n);
  const real = s.trips.filter(t => !t.demo);
  const L = s.lists = s.lists || {};
  L.lakes = mergeNames(L.lakes && L.lakes.length ? L.lakes : SEED.lakes, real.map(t => t.lake));
  L.baits = mergeNames(L.baits && L.baits.length ? L.baits : SEED.baits, real.flatMap(t => t.baits));
  L.weathers = mergeNames(L.weathers && L.weathers.length ? L.weathers : SEED.weathers, real.flatMap(t => t.weathers));

  if (s.sonst !== 2) { s.sonst = 2; if (!real.some(t => t.lake === 'Sonstiges')) L.lakes = L.lakes.filter(n => n !== 'Sonstiges'); if (!real.some(t => (t.weathers || []).includes('Sonstiges'))) L.weathers = L.weathers.filter(n => n !== 'Sonstiges'); }

  if (s.trips.some(t => t.demo) && s.demoV !== 5 && typeof demoTrips === 'function') { s.trips = [...s.trips.filter(t => !t.demo), ...demoTrips()]; s.trips.sort((x, y) => y.date.localeCompare(x.date)); }
  if (!s.nebel) { s.nebel = 1; L.weathers = mergeNames(L.weathers, ['Nebel']); }
  if (s.wOrd !== 3) {
    s.wOrd = 3;
    const pos = n => { const i = SEED.weathers.findIndex(x => x.toLowerCase() === String(n).toLowerCase()); return i < 0 ? 100 : (n === 'Sonstiges' ? 200 : i); };
    L.weathers = L.weathers.map((n, i) => [n, i]).sort((x, y) => pos(x[0]) - pos(y[0]) || x[1] - y[1]).map(x => x[0]);
  }
  s.geo = s.geo && typeof s.geo === 'object' && !Array.isArray(s.geo) ? s.geo : {};
  s.goals = Array.isArray(s.goals) ? s.goals.map(normGoal).filter(Boolean) : [];
  if (typeof ensureDemoGoals === 'function') ensureDemoGoals();
  if (!s.zcol) { s.zcol = 1; const z = s.species.find(x => x.name === 'Zander' && x.c === 2); if (z && !s.species.some(x => x.c === 6)) z.c = 6; }
  s.myName = typeof s.myName === 'string' ? s.myName.trim().slice(0, 30) : '';
  s.demoV = 5;
  s.v = 2;
  return s;
}
function addSpeciesTo(arr, name) {
  const used = new Set(arr.map(s => s.c));
  let c = 0; while (used.has(c) && c < 8) c++;
  arr.push({ name, c: c < 8 ? c : arr.length % 8 });
}
function loadStore() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.trips) && Array.isArray(s.species)) return migrateStore(s); }
  } catch (e) { memoryOnly = true; }
  return null;
}
function saveStore() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); memoryOnly = false; } catch (e) { memoryOnly = true; }
}

const pad = n => String(n).padStart(2, '0');
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function wdIndex(s) { return parseDate(s).getDay(); }
function fmtDate(s) { const [y, m, d] = s.split('-'); return WD_S[wdIndex(s)] + ', ' + d + '.' + m + '.' + y; }
function monthYear(s) { return MONTHS_L[Number(s.slice(5, 7)) - 1] + ' ' + s.slice(0, 4); }
function fmtNum(n, dec = 1) { return n == null ? '–' : n.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: dec }); }
function fmtW(g) { return g == null ? '–' : g >= 1000 ? fmtNum(g / 1000, 2) + ' kg' : fmtNum(g, 0) + ' g'; }
function daysSince(iso) { return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }
/* Name des Vaters: Standard Jürgen, in „Sicherung → Mein Name“ änderbar */
const myName = () => (store.myName || '').trim() || 'Jürgen';
const myGen = () => { const n = myName(); return /[sßxz]$/i.test(n) ? n + '’' : n + 's'; };
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function speciesColor(name) {
  const sp = store.species.find(x => x.name === name);
  return 'var(--sp' + ((sp ? sp.c : 7) % 8) + ')';
}
function lakes() { return [...new Set([...((store.lists && store.lists.lakes) || []), ...store.trips.map(t => t.lake)])].sort((a, b) => a.localeCompare(b, 'de')); }
const EXTRA_PEOPLE = [];
function personChoices() { return [...new Set([...people(), ...EXTRA_PEOPLE])].sort((a, b) => a.localeCompare(b, 'de')); }
function people() { return [...new Set(store.trips.flatMap(t => t.comp.map(c => c.name)))].sort((a, b) => a.localeCompare(b, 'de')); }
function years() { return [...new Set(store.trips.map(t => t.date.slice(0, 4)))].sort(); }
const listOf = kind => store.lists[LISTKEY[kind]];

/* Gewicht in Gramm (ganze Zahl) */
function parseWeight(text) {
  const t = String(text || '').trim();
  if (!t) return { w: null };
  if (!/^\d+$/.test(t)) return { err: 'Gewicht bitte als ganze Zahl in Gramm eingeben, zum Beispiel 450.' };
  const n = Number(t);
  if (n < 5 || n > 60000) return { err: 'Gewicht bitte in Gramm zwischen 5 und 60000 eingeben.' };
  return { w: n };
}

/* ===== Auswertung ===== */
const sum = a => a.reduce((x, y) => x + y, 0);
/* Länge ist freiwillig: Fische ohne Länge zählen mit, gehen aber nicht in Längenwerte ein */
const hasL = x => Number.isFinite(x.l);
const lf = a => a.filter(hasL);
const avg = a => a.length ? sum(a) / a.length : null;
function median(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

/* Perspektive der Auswertung: me = meine Fänge, comp = Fänge der Begleiter (nur Tage mit Begleitern), all = beide zusammen.
   Fische der Begleiter haben keine Länge (l: null). _own = meine eigenen Fische des Tages. */
const compFish = t => t.comp.flatMap(c => Object.entries(c.c || {}).flatMap(([s, n]) => Array.from({ length: n }, () => ({ s, l: null }))));
const whoNow = () => (typeof ui !== 'undefined' && ui.who) || 'me';
const persp = ts => { const w = whoNow(); return w === 'comp' ? ts.filter(t => t.comp.length).map(t => ({ ...t, _own: t.fish, fish: compFish(t) })) : w === 'all' ? ts.map(t => ({ ...t, _own: t.fish, fish: [...t.fish, ...compFish(t)] })) : ts.map(t => t.comp.length ? { ...t, comp: [] } : t); };
function applyFilter(f) {
  const l = store.trips.filter(t => !t.planned && (!f.year || t.date.slice(0, 4) === f.year) && (!f.month || t.date.slice(5, 7) === f.month) && (!f.lake || t.lake === f.lake));
  return f.raw ? l : persp(l);
}
function groupTrips(trips, keyFn) {
  const m = new Map();
  for (const t of trips) {
    const k = keyFn(t);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(t);
  }
  return m;
}
function summarize(trips) {
  const fish = trips.flatMap(t => t.fish);
  const lens = lf(fish).map(x => x.l);
  const blank = trips.filter(isBlankDay).length;
  let best = null, heavy = null;
  for (const t of trips) for (const x of t.fish) {
    if (hasL(x) && (!best || x.l > best.l)) best = { l: x.l, w: x.w || null, s: x.s, date: t.date, lake: t.lake };
    if (x.w && (!heavy || x.w > heavy.w)) heavy = { l: x.l, w: x.w, s: x.s, date: t.date, lake: t.lake };
  }
  return { days: trips.length, fish: fish.length, blank, perDay: trips.length ? fish.length / trips.length : null, avgLen: avg(lens), best, heavy };
}
function allSpeciesNames(trips) {
  const have = new Set(trips.flatMap(t => t.fish.map(x => x.s)));
  return [...store.species.map(s => s.name).filter(n => have.has(n)), ...[...have].filter(n => !store.species.some(z => z.name === n))];
}
function bySpecies(trips) {
  const out = [];
  for (const name of allSpeciesNames(trips)) {
    const rows = [];
    for (const t of trips) for (const x of t.fish) if (x.s === name) rows.push({ l: x.l, w: x.w || null, date: t.date, lake: t.lake });
    if (!rows.length) continue;
    const rl = lf(rows), lens = rl.map(r => r.l);
    let best = rl[0] || null;
    for (const r of rl) if (r.l > best.l) best = r;
    out.push({ name, n: rows.length, nl: rl.length, avg: avg(lens), med: median(lens), min: lens.length ? Math.min(...lens) : null, max: best ? best.l : null, best, lens, rows });
  }

}
function byLake(trips) {

}
function byMonth(trips) {
  const g = groupTrips(trips, t => Number(t.date.slice(5, 7)) - 1);
  return MONTHS.map((m, i) => { const ts = g.get(i) || []; const s = summarize(ts); return { label: m, days: s.days, perDay: s.perDay }; });
}
function byWeekday(trips) {

  return WD_ORDER.map(i => { const ts = g.get(i) || []; const s = summarize(ts); return { label: WD_S[i], days: s.days, perDay: s.perDay }; });
}
function byYear(trips) {
  const g = groupTrips(trips, t => t.date.slice(0, 4));
  return [...g.keys()].sort().map(y => {
    const ts = g.get(y);
    const segs = allSpeciesNames(ts).map(name => ({ name, v: ts.reduce((a, t) => a + t.fish.filter(x => x.s === name).length, 0) })).filter(s => s.v > 0);

}

/* Begleiter: Fänge mit Art, Anzahl und (nach Gefühl) Größe klein/mittel/groß */
const compN = c => sum(Object.values(c.c || {}));
/* Schneidertag: kein Fisch bei mir UND bei keinem Begleiter. Nur ich leer, aber ein Begleiter fing = kein Schneidertag */
const isBlankDay = t => !t.planned && t.fish.length === 0 && sum(t.comp.map(compN)) === 0;
const onlyCompDay = t => !t.planned && t.fish.length === 0 && sum(t.comp.map(compN)) > 0;
function compSizes(c, sp) { const z = (c.cs && c.cs[sp]) || {}; return { k: z.k || 0, m: z.m || 0, g: z.g || 0 }; }
function byCompanion(trips) {
  const names = [...new Set(trips.flatMap(t => t.comp.map(c => c.name)))];
  const solo = trips.filter(t => t.comp.length === 0);
  const rows = names.map(name => {
    const ts = trips.filter(t => t.comp.some(c => c.name === name));
    const mine = sum(ts.map(t => t.fish.length));
    const his = sum(ts.map(t => sum(t.comp.filter(c => c.name === name).map(compN))));
    return { name, days: ts.length, mine, his, minePerDay: mine / ts.length, hisPerDay: his / ts.length };

const isOverdue = t => t.planned && t.date < todayStr();
function plannedWith(t) { return t.comp && t.comp.length ? 'mit ' + t.comp.map(c => esc(c.name)).join(', ') : ''; }


/* Köder, Wetter, Temperatur: ein Angeltag zählt bei jedem Eintrag mit, der an dem Tag gewählt wurde */
function byCategory(trips, getter, order) {
  const m = new Map();
  for (const t of trips) for (const k of new Set(getter(t))) { if (!m.has(k)) m.set(k, []); m.get(k).push(t); }
  const rows = [...m].map(([name, ts]) => ({ name, ...summarize(ts) }));
  if (order) rows.sort((a, b) => order.indexOf(a.name) - order.indexOf(b.name)); else rows.sort((a, b) => b.days - a.days || b.fish - a.fish);
  return { rows, unknown: trips.filter(t => !getter(t).length).length };
}

/* ===== Beispieldaten (klar markiert, jederzeit entfernbar) ===== */
function demoTrips() {
  let seed = 20260101;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const gauss = () => { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); };
  const lakesD = [
    { n: 'Oberuckersee', k: 1.2, p: 3.0 }, { n: 'Krewitz', k: 0.7, p: 2.0 },
    { n: 'Sukow', k: 1.0, p: 2.6 }, { n: 'Ostsee', k: 0.5, p: 1.6 }
  ];
  const season = [0, 0, 0.3, 0.8, 1.1, 1.0, 0.8, 0.8, 1.2, 1.3, 0.9, 0];
  const tempByMonth = ['kalt', 'kalt', 'kühl', 'mild', 'warm', 'heiß', 'heiß', 'warm', 'mild', 'kühl', 'kühl', 'kalt'];
  const names = ['Reinhold', 'Uwe', 'Frank'];
  const pickN = (arr, n) => { const a = [...arr], o = []; while (o.length < n && a.length) o.push(a.splice(Math.floor(rnd() * a.length), 1)[0]); return o; };
  const today = new Date(), start = new Date(2024, 3, 6);
  const used = new Set(), trips = [];
  let guard = 0;
  while (trips.length < 62 && guard++ < 4000) {
    const d = new Date(start.getTime() + Math.floor(rnd() * ((today - start) / 86400000)) * 86400000);
    const m = d.getMonth();
    if (season[m] === 0 || (d.getDay() > 0 && d.getDay() < 6 && rnd() < 0.55)) continue;
    const date = d.getFullYear() + '-' + pad(m + 1) + '-' + pad(d.getDate());
    if (used.has(date)) continue;
    used.add(date);
    const lk = lakesD[Math.floor(rnd() * lakesD.length)];
    const lam = lk.p * lk.k * season[m];
    let n = 0; for (let L = Math.exp(-lam), p = 1; ; n++) { p *= rnd(); if (p <= L) break; }
    const fish = [];
    const wt = (l, k) => rnd() < 0.5 ? { w: Math.round(k * l * l * l) } : {};
    for (let i = 0; i < n; i++) {
      const r = rnd();
      if (r < 0.68) { const l = Math.max(14, Math.min(42, Math.round(25 + gauss() * 5 + (d.getFullYear() - 2024) * 0.8))); fish.push({ s: 'Barsch', l, ...wt(l, 0.0128) }); }
      else if (r < 0.88) { const l = Math.max(42, Math.min(98, Math.round(64 + gauss() * 12))); fish.push({ s: 'Hecht', l, ...wt(l, 0.0045) }); }
      else { const l = Math.max(40, Math.min(75, Math.round(52 + gauss() * 7))); fish.push({ s: 'Zander', l, ...wt(l, 0.0063) }); }
    }
    const comp = [];
    if (rnd() < 0.6) {
      const nm = names[Math.floor(rnd() * 2.4)] || 'Reinhold';
      const c = {}, cs = {}; const k = Math.floor(rnd() * 5);
      if (k) { c.Barsch = k; const a = Math.floor(rnd() * (k + 1)); cs.Barsch = { k: a, m: k - a, g: 0 }; }
      if (rnd() < 0.3) { c.Hecht = 1; cs.Hecht = { k: 0, m: 0, g: 1 }; }
      comp.push({ name: nm, c, cs });
    }
    trips.push({
      id: uid(), date, lake: lk.n, fish, comp, note: '', demo: true, ...(() => { const dd = Number(date.slice(8)); if (dd % 5 === 0) return {}; const sh = 5 + (dd * 7) % 5, du = 3 + (dd * 3) % 6, p = x => pad(x) + ':' + (dd % 2 ? '30' : '00'); return { time: p(sh), timeEnd: p(sh + du) }; })(),
      baits: pickN(SEED.baits.slice(0, 8), 1 + Math.floor(rnd() * 2)), weathers: pickN(SEED.weathers, 1 + Math.floor(rnd() * 2)), temps: [tempByMonth[m]]
    });
  }
  const addD = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  [[-6, 'Krewitz', ['Uwe']], [3, 'Oberuckersee', ['Reinhold']], [9, 'Sukow', ['Frank', 'Uwe']], [24, 'Ostsee', []]].forEach(([n, lake, who]) =>
    trips.push({ id: uid(), date: addD(n), lake, fish: [], comp: who.map(name => ({ name, c: {} })), note: '', demo: true, planned: true, baits: [], weathers: [], temps: [] }));
  return trips.sort((a, b) => b.date.localeCompare(a.date));
}

/* ===== Erweiterungen: Fische mit Vermerk, Mondphase, Tageszeit ===== */
/* "27" oder "27z" (zurückgesetzt) oder "27e" (entnommen); defRel: true | false | undefined */
function parseFish(text, defRel) {
  const parts = text.replace(/,(?=\d)/g, '.').split(/[\s;,\/+]+/).filter(Boolean);
  const ok = [], bad = [];
  for (const p of parts) {
    const m = /^(\d+(?:\.\d+)?)([zZeE])?$/.exec(p), n = m ? Number(m[1]) : NaN;
    if (m && n >= 3 && n <= 200) {
      const f = { l: Math.round(n * 10) / 10 };
      const r = m[2] ? m[2].toLowerCase() === 'z' : defRel;
      if (r === true || r === false) f.r = r;
      ok.push(f);
    } else bad.push(p);
  }
  return { ok, bad };
}

/* Dauer in Stunden, wenn Beginn und Ende eingetragen sind (Ende vor Beginn = über Mitternacht) */
function tripHours(t) {
  if (!t.time || !t.timeEnd) return null;
  const m = x => { const [h, mi] = x.split(':').map(Number); return h * 60 + mi; };
  let d = m(t.timeEnd) - m(t.time); if (d < 0) d += 1440;
  return d > 0 && d <= 1440 ? d / 60 : null;
}
const timeLabel = t => t.time ? t.time + (t.timeEnd ? '–' + t.timeEnd : '') + ' Uhr' : (t.timeEnd ? 'bis ' + t.timeEnd + ' Uhr' : '');
function byDaytime(trips) {
  const B = [['Früh', 'vor 9 Uhr', h => h < 9], ['Vormittag', '9 bis 12', h => h >= 9 && h < 12], ['Nachmittag', '12 bis 17', h => h >= 12 && h < 17], ['Abend', 'ab 17 Uhr', h => h >= 17]];
  const withT = trips.filter(t => t.time && /^\d{1,2}:\d{2}$/.test(t.time));
  return { n: withT.length, rows: B.map(([label, sub, f]) => { const s = summarize(withT.filter(t => f(Number(t.time.split(':')[0])))); return { label, sub, days: s.days, perDay: s.perDay }; }) };
}

/* ===== Listen verwalten: umbenennen, zusammenführen, löschen ===== */
function useCount(kind, name) {
  const ts = store.trips;
  if (kind === 'lake') return ts.filter(t => t.lake === name).length;
  if (kind === 'bait') return ts.filter(t => t.baits.includes(name)).length;
  if (kind === 'weather') return ts.filter(t => t.weathers.includes(name)).length;
  if (kind === 'temp') return ts.filter(t => (t.temps || []).includes(name)).length;
  if (kind === 'species') return sum(ts.map(t => t.fish.filter(x => x.s === name).length + sum(t.comp.map(c => (c.c && c.c[name]) || 0))));
  if (kind === 'person') return ts.filter(t => t.comp.some(c => c.name === name)).length;
  return 0;
}
function mergeCounts(into, from) { for (const [k, v] of Object.entries(from || {})) into[k] = (into[k] || 0) + v; }
function renameItem(kind, from, to) {
  const lc = s => s.toLowerCase();
  const sets = [store.trips, store.trash || []];
  const dedupe = a => { const seen = new Set(); return a.map(x => x === from ? to : x).filter(x => { const k = lc(x); if (seen.has(k)) return false; seen.add(k); return true; }); };
  for (const arr of sets) for (const t of arr) {
    if (kind === 'lake') { if (t.lake === from) t.lake = to; }
    else if (kind === 'bait') t.baits = dedupe(t.baits || []);
    else if (kind === 'weather') t.weathers = dedupe(t.weathers || []);
    else if (kind === 'temp') t.temps = dedupe(t.temps || []);
    else if (kind === 'species') {
      t.fish.forEach(x => { if (x.s === from) x.s = to; });
      t.comp.forEach(c => {
        if (c.c && c.c[from] != null) { const n = c.c[from]; delete c.c[from]; c.c[to] = (c.c[to] || 0) + n; }
        if (c.cs && c.cs[from]) { const z = c.cs[from]; delete c.cs[from]; const o = c.cs[to] = c.cs[to] || { k: 0, m: 0, g: 0 }; o.k += z.k || 0; o.m += z.m || 0; o.g += z.g || 0; }
      });
    } else if (kind === 'person') {
      t.comp.forEach(c => { if (c.name === from) c.name = to; });
      const m = new Map();
      for (const c of t.comp) {
        if (!m.has(c.name)) m.set(c.name, c);
        else { const a = m.get(c.name); mergeCounts(a.c, c.c); for (const [sp, z] of Object.entries(c.cs || {})) { a.cs = a.cs || {}; const o = a.cs[sp] = a.cs[sp] || { k: 0, m: 0, g: 0 }; o.k += z.k || 0; o.m += z.m || 0; o.g += z.g || 0; } }
      }
      t.comp = [...m.values()];
    }
  }
  if (kind === 'species') {
    const target = store.species.find(s => lc(s.name) === lc(to) && s.name !== from);
    if (target) store.species = store.species.filter(s => s.name !== from);
    else store.species.forEach(s => { if (s.name === from) s.name = to; });
  } else if (LISTKEY[kind]) {
    store.lists[LISTKEY[kind]] = dedupe(store.lists[LISTKEY[kind]]);
  }
}
function deleteItem(kind, name) {
  if (useCount(kind, name) > 0) return false;
  if (kind === 'species') store.species = store.species.filter(s => s.name !== name);
  else if (LISTKEY[kind]) store.lists[LISTKEY[kind]] = store.lists[LISTKEY[kind]].filter(x => x !== name);
  return true;
}

/* ===== Diagramme (SVG, Farben über CSS-Klassen/Variablen) ===== */
function niceMax(m) { const p = Math.pow(10, Math.floor(Math.log10(m))), f = m / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

function barChart(items, o = {}) {
  const W = 640, H = o.h || 240, L = 34, R = 8, T = 26, B = 52;
  const iw = W - L - R, ih = H - T - B, y0 = T + ih;
  const top = niceMax(Math.max(0.5, ...items.map(i => i.value || 0)));
  const y = v => T + ih * (1 - v / top);
  const slot = iw / items.length, bw = Math.min(56, slot * 0.62);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Diagramm')}">`;
  for (const g of [0, 0.5, 1]) {
    const v = top * g;
    s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="mut" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmtNum(v, 1)}</text>`;
  }
  items.forEach((it, i) => {
    const cx = L + slot * i + slot / 2, x = cx - bw / 2;
    if (it.value == null || it.value === 0 && !it.days) {
      s += `<text class="mut" x="${cx}" y="${y0 - 6}" text-anchor="middle">–</text>`;
    } else {
      const op = it.dim ? 0.45 : 1;
      if (it.segs) {
        let acc = 0;
        for (const sg of it.segs) {
          const yt = y(acc + sg.v), yb = y(acc);
          s += `<rect x="${x}" y="${yt}" width="${bw}" height="${Math.max(0, yb - yt)}" rx="3" class="surf" style="fill:${speciesColor(sg.name)}"><title>${esc(sg.name)}: ${sg.v}</title></rect>`;
          acc += sg.v;
        }
      } else {
        s += `<rect x="${x}" y="${y(it.value)}" width="${bw}" height="${Math.max(1, y0 - y(it.value))}" rx="3" style="fill:var(--accent);opacity:${op}"/>`;
      }
      s += `<text class="val" x="${cx}" y="${y(it.value) - 6}" text-anchor="middle">${fmtNum(it.value, 1)}</text>`;
    }
    s += `<text x="${cx}" y="${y0 + 17}" text-anchor="middle">${esc(it.label)}</text>`;
    (it.sub || []).forEach((t, k) => { s += `<text class="mut" x="${cx}" y="${y0 + 31 + k * 12}" text-anchor="middle">${esc(t)}</text>`; });
  });
  s += `<line class="base" x1="${L}" x2="${W - R}" y1="${y0}" y2="${y0}"/></svg>`;
  return s;
}

    : d === 'lake' ? (ui.lake ? esc(ui.lake) : '') : d === 'month' ? (ui.month ? MONTHS_L[Number(ui.month) - 1] : '') : (ui.year ? esc(ui.year) : '');
  const spN = [...new Set(store.trips.flatMap(t => t.fish.map(f => f.s)))].sort((a, b) => a.localeCompare(b, 'de'));
  const spS = dims.includes('spec') ? sel('spec', opts(spN, ui.dspec, 'alle Arten')) : '';
  const t = [spS, one('lake'), one('month'), one('year')].filter(Boolean).map(x => `<span class="sci">${x}</span>`).join(' ');
  return ` <span class="scope">– ${t || 'alle Jahre'}</span>`;
}
const stTbl = (head, rows, empty, cls) => rows ? `<div class="stw"><table class="st${cls ? ' ' + cls : ''}"><thead><tr>${head.map(h => `<th${h[1] ? ' class="n"' : ''}>${h[0]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="hint">${empty}</p>`;
const hpanel = (ic, title, sc, body, id) => `<div class="panel"${id ? ` id="${id}"` : ''} style="margin-top:16px"><h2>${hic(ic)}${title}${sc}</h2>${body}</div>`;

/* Fänge pro Jahr: antippbare Balken, wählt das Jahr */
function yearChart(all) {
  const yrs = byYear(all), S = summarize(all), sp = bySpecies(all);
  if (!yrs.length) return '';
  const max = Math.max(1, ...yrs.map(r => r.fish));
  const col = (r, h, y, sel, cls) => `<button type="button" class="yc${sel ? ' sel' : ''}${cls || ''}" data-act="dyear" data-y="${y}" aria-pressed="${sel}" aria-label="${esc(r.label)}: ${r.fish} Fische"><span class="yv">${r.fish}</span><span class="yb" style="height:${Math.max(3, h)}px">${(r.segs || []).map(sg => `<i style="flex:${sg.v};background:${speciesColor(sg.name)}"></i>`).join('')}</span><span class="yl">${esc(r.label)}</span></button>`;
  const H = 150;
  const cols = yrs.map(r => col(r, r.fish / max * H, r.label, ui.year === r.label)).join('');
  const total = yrs.length > 1 ? `<span class="ysep" aria-hidden="true"></span>${col({ label: 'Gesamt', fish: S.fish, segs: sp.map(x => ({ name: x.name, v: x.n })) }, H, '', !ui.year, ' tot')}` : '';
  return `<div class="ych">${cols}${total}</div>${legendHtml(sp.map(x => x.name))}<p class="hint">Einen Balken antippen, um nur dieses Jahr zu sehen. „Gesamt“ zeigt alle Jahre (eigener Maßstab).</p>`;
}

/* Kurzfazit: Satzbausteine mit den echten Zahlen, passend zur Auswahl */
function fazitHtml(trips) {
  const S = summarize(trips);
  if (!S.days || whoNow() !== 'me') return '';
  const pl = (n, e, m) => n + ' ' + (n === 1 ? e : m);
  const s = [];
  s.push(`Du warst an ${pl(S.days, 'Angeltag', 'Angeltagen')} am Wasser und hast ${pl(S.fish, 'Fisch', 'Fische')} gefangen${S.fish ? ', im Schnitt ' + fmtNum(S.perDay, 1) + ' pro Angeltag' : ''}.`);
  if (S.blank === 0) s.push('An jedem Angeltag gab es mindestens einen Fisch.');
  else s.push(`An ${pl(S.blank, 'Tag', 'Tagen')} blieb der Fang aus (${fmtNum(S.blank / S.days * 100, 0)} %).`);
  const sp = bySpecies(trips).sort((a, b) => b.n - a.n);
  if (sp.length) s.push(`Am häufigsten war ${esc(sp[0].name)} (${pl(sp[0].n, 'Fisch', 'Fische')}, ${fmtNum(sp[0].n / S.fish * 100, 0)} %)${sp[1] ? ', danach ' + esc(sp[1].name) + ' (' + sp[1].n + ')' : ''}.`);
  const lk = byLake(trips);
  if (!ui.lake && lk.length > 1) {
    const d = [...lk].sort((a, b) => b.days - a.days)[0];
    if (lk[0].fish > 0) s.push(lk[0].lake === d.lake ? `Dein Hauptgewässer war ${esc(d.lake)}: ${lk[0].fish} Fische an ${pl(d.days, 'Angeltag', 'Angeltagen')}.` : `Die meisten Fische gab es am ${esc(lk[0].lake)} (${lk[0].fish}), die meisten Angeltage am ${esc(d.lake)} (${d.days}).`);
  }
  if (!ui.year) {
    const yrs = byYear(trips);
    if (yrs.length > 1) { const b = [...yrs].sort((a, c) => c.fish - a.fish)[0]; s.push(`Bestes Jahr: ${b.label} mit ${pl(b.fish, 'Fisch', 'Fischen')} an ${pl(b.days, 'Angeltag', 'Angeltagen')}.`); }
  } else {
    const prev = String(Number(ui.year) - 1), pt = applyFilter({ year: prev, month: ui.month, lake: ui.lake });
    if (pt.length) { const P = summarize(pt), d = S.fish - P.fish; s.push(`Gegenüber ${prev}: ${d === 0 ? 'genauso viele Fische' : pl(Math.abs(d), 'Fisch', 'Fische') + (d > 0 ? ' mehr' : ' weniger')} (${S.fish} statt ${P.fish}) bei ${pl(S.days, 'Angeltag', 'Angeltagen')} statt ${P.days}.`); }
  }
  if (!ui.month) {
    const g = groupTrips(trips, t => t.date.slice(5, 7)), ms = [...g].map(([m, ts]) => [m, sum(ts.map(t => t.fish.length)), ts.length]).sort((a, b) => b[1] - a[1]);
    if (ms.length > 1 && ms[0][1] > 0) s.push(`Fischreichster Monat: ${MONTHS_L[Number(ms[0][0]) - 1]} (${ms[0][1]} Fische an ${pl(ms[0][2], 'Angeltag', 'Angeltagen')}).`);
  }
  if (S.best) s.push(`Größter Fang: ${esc(S.best.s)} mit ${fmtNum(S.best.l, 1)} cm${S.best.w ? ' und ' + fmtW(S.best.w) : ''} (${esc(S.best.lake)}, ${monthYear(S.best.date)}).`);
  const cp = byCompanion(trips).rows;
  if (cp.length) s.push(`Am häufigsten warst du mit ${esc(cp[0].name)} unterwegs (${pl(cp[0].days, 'Angeltag', 'Angeltage')}, ${esc(cp[0].name)} fing dabei ${pl(cp[0].his, 'Fisch', 'Fische')}).`);
  return `<div class="panel fazit"><h2>${hic('chart')}Kurzfazit${scopeTxt()}</h2><p>${s.filter(Boolean).join(' ')}</p></div>`;
}

/* Fänge pro Monat: antippbare Balken, wählt den Monat (folgt dem Jahresfilter) */
function monthChart() {
  const all = spOnly(applyFilter({ year: ui.year, month: '', lake: ui.lake }));
  if (!all.length) return '';
  const H = 120;
  const per = MONTHS.map((lab, i) => { const mm = pad(i + 1), ts = all.filter(t => t.date.slice(5, 7) === mm), segs = bySpecies(ts).map(s => ({ name: s.name, v: s.n })); return { mm, i, lab, fish: segs.reduce((a, s) => a + s.v, 0), segs }; });
  const max = Math.max(1, ...per.map(r => r.fish));
  const cols = per.map(r => `<button type="button" class="yc${ui.month === r.mm ? ' sel' : ''}" data-act="dmonth" data-m="${r.mm}" aria-pressed="${ui.month === r.mm}" aria-label="${MONTHS_L[r.i]}: ${r.fish} Fische"><span class="yv">${r.fish || ''}</span><span class="yb" style="height:${r.fish ? Math.max(3, r.fish / max * H) : 0}px">${r.segs.map(sg => `<i style="flex:${sg.v};background:${speciesColor(sg.name)}"></i>`).join('')}</span><span class="yl">${r.lab}</span></button>`).join('');
  return `<div class="ych mo">${cols}</div>${legendHtml(bySpecies(all).map(x => x.name))}<p class="hint">Einen Monat antippen, um nur diesen Monat zu sehen. Es zählen ${ui.year ? 'die Fische aus ' + esc(ui.year) : 'alle Jahre zusammen'}.</p>`;
}

function secOverview(trips, sc) {
  const S = summarize(trips);
  const all = applyFilter({ year: '', month: ui.month, lake: ui.lake });
  const allS = spOnly(all), yrs = byYear(allS);
  const rows = yrs.map(r => `<tr><td><b>${esc(r.label)}</b></td><td class="n">${r.days}</td><td class="n">${r.fish}</td>${ui.dspec ? '' : `<td class="n">${r.days - 0 ? summarize(all.filter(t => t.date.startsWith(r.label))).blank : 0}</td>`}<td class="n">${fmtNum(r.perDay, 1)}</td></tr>`).join('');
  return `<h2 class="kh" id="a-kpi">${hic('chart')}Überblick${sc}</h2><p class="sub" style="margin:-4px 0 10px">${whoNote()}</p><div class="kpis">
    ${kpi(S.days, 'Angeltage', '', 'days')}
    ${kpi(S.fish, 'Fische gefangen', '', 'fish')}
    ${kpi(S.blank, { me: 'Tage ohne Fang (bei ' + myName() + ')', comp: 'Tage ohne Fang (Begleiter)', all: 'Schneidertage' }[whoNow()], '', 'blank')}
    ${kpi('Ø ' + fmtNum(S.perDay, 1), 'Fische pro Angeltag')}
  </div>`
    + goalsCard()
    + fazitHtml(trips)
    + hpanel('fish', 'Fänge pro Jahr', scopeTxt(['spec', 'lake', 'month'], ['year']), yearChart(allS) + (yrs.length ? stTbl([['Jahr'], [ui.dspec ? 'Tage mit Fang' : 'Angeltage', 1], ['Fische', 1], ...(ui.dspec ? [] : [['Ohne Fang', 1]]), ['Ø pro Tag', 1]], rows, '') : ''), 'a-year')
    + hpanel('cal', 'Fänge pro Monat', scopeTxt(['spec', 'lake', 'year'], ['month']), monthChart(), 'a-month')
    + specPanel(trips, all, sc);
}


/* Fänge je Fischart: Art antippen zeigt Jahre und Seen */
function specPanel(trips, all, sc) {
  const sp = bySpecies(trips).sort((a, b) => b.n - a.n);
  if (!sp.length) return '';
  const max = Math.max(1, ...sp.map(r => r.n));
  const sel = sp.find(r => r.name === ui.dspec);
  const bars = `<div class="hb hbbtn">${sp.map(r => `<button type="button" class="hbr${sel && sel.name === r.name ? ' sel' : ''}" data-act="dspec" data-s="${esc(r.name)}" aria-pressed="${!!sel && sel.name === r.name}"><span class="hbl">${esc(r.name)}</span><span class="hbt"><i style="width:${Math.max(2, r.n / max * 100)}%;background:${speciesColor(r.name)}"></i></span><b class="hbv">${r.n}</b></button>`).join('')}</div>`;
  let det = '<p class="hint">Eine Art antippen, um ihre Fänge nach Jahr und See zu sehen.</p>';
  if (sel) {
    const rowsAll = (bySpecies(all).find(r => r.name === sel.name) || sel).rows;
    const yrs = [...new Set(rowsAll.map(r => r.date.slice(0, 4)))].sort();
    const lakes = [...new Set(rowsAll.map(r => r.lake))].map(l => ({ l, n: rowsAll.filter(r => r.lake === l).length })).sort((a, b) => b.n - a.n || a.l.localeCompare(b.l));
    const c = (l, y) => rowsAll.filter(r => (l == null || r.lake === l) && (y == null || r.date.startsWith(y))).length;
    const cellv = n => n ? n : '<span class="sub">–</span>';
    const head = [['See'], ...yrs.map(y => [ui.year === y ? y + ' ●' : y, 1]), ['Gesamt', 1]];
    const body = lakes.map(({ l }) => `<tr><td><b>${esc(l)}</b></td>${yrs.map(y => `<td class="n">${cellv(c(l, y))}</td>`).join('')}<td class="n"><b>${c(l, null)}</b></td></tr>`).join('')
      + `<tr class="tot"><td><b>Gesamt</b></td>${yrs.map(y => `<td class="n"><b>${c(null, y)}</b></td>`).join('')}<td class="n"><b>${rowsAll.length}</b></td></tr>`;
    det = `<div class="detail"><b>${esc(sel.name)}</b><span>${sel.n} Fische</span>${sel.avg != null ? `<span>Ø ${fmtNum(sel.avg, 1)} cm</span>` : ''}</div>`
      + `<p class="sub" style="margin-top:12px">${whoLabel()}: ${esc(sel.name)} je See und Jahr.</p>` + stTbl(head, body, '');
  }
  return hpanel('fish', 'Fänge je Art', scopeTxt(['year', 'spec']), bars + det, 'a-spec');
}

/* Seen im Jahresvergleich: Heatmap See × Jahr, dunkler = mehr */
function lakeYearHeat(m) {
  const base = applyFilter({ year: '', month: ui.month, lake: '' });
  const yrs = [...new Set(base.map(t => t.date.slice(0, 4)))].sort();
  const lks = byLake(base).sort((a, b) => b[m] - a[m] || b.days - a.days).map(r => r.lake);
  if (!yrs.length) return '<p class="hint">Keine Einträge.</p>';
  const val = (l, y) => { const S = summarize(base.filter(t => t.lake === l && (!y || t.date.startsWith(y)))); return m === 'days' ? S.days : m === 'fish' ? S.fish : S.blank; };
  const grid = lks.map(l => yrs.map(y => val(l, y)));
  const mx = Math.max(1, ...grid.flat());
  const short = yrs.length > 7;
  const head = `<tr><th>See</th>${yrs.map(y => `<th class="n">${short ? '’' + y.slice(2) : y}</th>`).join('')}<th class="n">Ges.</th></tr>`;
  const rows = lks.map((l, i) => `<tr><th scope="row">${esc(l)}</th>${grid[i].map((v, j) => { const al = v ? Math.max(.14, v / mx * .88) : 0; return `<td><button type="button" class="hmc${al > .5 ? ' dk' : ''}" style="${v ? 'background:rgba(11,107,114,' + al.toFixed(2) + ')' : ''}" data-act="dlkyr" data-lake="${esc(l)}" data-y="${yrs[j]}" aria-label="${esc(l)} ${yrs[j]}: ${v}">${v || '–'}</button></td>`; }).join('')}<td class="n"><b>${val(l, '')}</b></td></tr>`).join('');
  return `<div class="stw"><table class="hm"><thead>${head}</thead><tbody>${rows}</tbody></table></div><p class="hint">Je dunkler ein Feld, desto mehr. Ein Feld antippen zeigt diesen See in diesem Jahr.</p>`;
}
function lakeMonthHeat(m) {
  const base = applyFilter({ year: ui.year, month: '', lake: '' });
  if (!base.length) return '<p class="hint">Keine Einträge.</p>';
  const lks = byLake(base).sort((a, b) => b[m] - a[m] || b.days - a.days).map(r => r.lake);
  const val = (l, mm) => { const S = summarize(base.filter(t => t.lake === l && (!mm || t.date.slice(5, 7) === mm))); return m === 'days' ? S.days : m === 'fish' ? S.fish : S.blank; };
  const grid = lks.map(l => MONTHS.map((_, i) => val(l, pad(i + 1))));
  const mx = Math.max(1, ...grid.flat());
  const head = `<tr><th>See</th>${MONTHS.map(x => `<th class="n">${x}</th>`).join('')}<th class="n">Ges.</th></tr>`;
  const rows = lks.map((l, i) => `<tr><th scope="row">${esc(l)}</th>${grid[i].map((v, j) => { const al = v ? Math.max(.14, v / mx * .88) : 0; return `<td><button type="button" class="hmc${al > .5 ? ' dk' : ''}" style="${v ? 'background:rgba(11,107,114,' + al.toFixed(2) + ')' : ''}" data-act="dlkmo" data-lake="${esc(l)}" data-m="${pad(j + 1)}" aria-label="${esc(l)} ${MONTHS_L[j]}: ${v}">${v || '–'}</button></td>`; }).join('')}<td class="n"><b>${val(l, '')}</b></td></tr>`).join('');
  return `<div class="stw"><table class="hm"><thead>${head}</thead><tbody>${rows}</tbody></table></div><p class="hint">Je dunkler ein Feld, desto mehr. Es zählen ${ui.year ? 'die Daten aus ' + esc(ui.year) : 'alle Jahre zusammen'}. Ein Feld antippen zeigt diesen See in diesem Monat.</p>`;
}
/* Zeilenbalken je See: Angeltage geteilt in Tage mit Fang / ohne Fang, rechts die Fische */
function lakeDayBars(rows, m, sel) {
  const list = rows.slice().sort((a, b) => b[m] - a[m] || b.days - a.days), mx = Math.max(1, ...list.map(r => r.days));
  return `<div class="sbl"><span><i class="sg ok"></i>Tage mit Fang</span><span><i class="sg no"></i>Tage ohne Fang</span></div><div class="sb">${list.map(r => {
    const ok = r.days - r.blank, on = !!sel && sel.lake === r.lake;
    return `<button type="button" class="sbr${on ? ' sel' : ''}" data-act="dlk" data-lake="${esc(r.lake)}" aria-pressed="${on}"><span class="sbn">${esc(r.lake)}<small>${r.days} ${r.days === 1 ? 'Angeltag' : 'Angeltage'}</small></span><span class="sbt"><span class="sbb" style="width:${r.days / mx * 100}%">${ok ? `<i class="sg ok" style="flex:${ok}">${ok}</i>` : ''}${r.blank ? `<i class="sg no" style="flex:${r.blank}">${r.blank}</i>` : ''}</span></span><b class="sbf">${r.fish}<small>${r.fish === 1 ? 'Fisch' : 'Fische'}</small></b></button>`;
  }).join('')}</div>`;
}
function secLakesNew(trips, sc) {
  const m = ui.lakeM || 'days', v = ui.lakeV || 'total';
  const lab = { days: 'Angeltage', fish: 'Fische', blank: 'Ohne Fang' };
  const viewSeg = `<div class="seg" role="group" aria-label="Ansicht"><button type="button" data-act="lview" data-v="total" aria-pressed="${v === 'total'}">Gesamt</button><button type="button" data-act="lview" data-v="years" aria-pressed="${v === 'years'}">Jahresvergleich</button><button type="button" data-act="lview" data-v="months" aria-pressed="${v === 'months'}">Monatsvergleich</button></div>`;
  const metSeg = `<div class="seg" role="group" aria-label="Anzeige" style="margin-top:10px">${Object.entries(lab).map(([k, t]) => `<button type="button" data-act="lmet" data-m="${k}" aria-pressed="${m === k}">${t}</button>`).join('')}</div>`;
  if (v === 'months') return hpanel('pin', 'Auf den Seen', sc, viewSeg + metSeg + (ui.month ? '<p class="hint">Der Monatsvergleich zeigt immer alle Monate.</p>' : '') + lakeMonthHeat(m), 'a-lakes');
  if (v === 'years') return hpanel('pin', 'Auf den Seen', sc, viewSeg + metSeg + (ui.year ? '<p class="hint">Der Jahresvergleich zeigt immer alle Jahre.</p>' : '') + lakeYearHeat(m), 'a-lakes');
  const rows = byLake(trips).sort((a, b) => b[m] - a[m] || b.days - a.days);
  const max = Math.max(1, ...rows.map(r => r[m]));
  const sel = rows.find(r => r.lake === ui.dlake);
  const bars = `<div class="hb hbbtn">${rows.map(r => `<button type="button" class="hbr${sel && sel.lake === r.lake ? ' sel' : ''}" data-act="dlk" data-lake="${esc(r.lake)}" aria-pressed="${!!sel && sel.lake === r.lake}"><span class="hbl">${esc(r.lake)}</span><span class="hbt"><i style="width:${r[m] > 0 ? Math.max(2, r[m] / max * 100) : 0}%"></i></span><b class="hbv">${r[m]}</b></button>`).join('')}</div>`;
  const det = sel ? `<div class="detail"><b>${esc(sel.lake)}</b><span>${sel.days} ${sel.days === 1 ? 'Angeltag' : 'Angeltage'}</span><span>${sel.fish} Fische</span><span>${sel.blank} ohne Fang</span><span>Ø ${fmtNum(sel.perDay, 1)} pro Tag</span>${sel.best ? `<span>Längster: ${fmtNum(sel.best.l, 1)} cm ${esc(sel.best.s)}</span>` : ''}</div>` : '<p class="hint">Einen See antippen, um seine Zahlen zu sehen.</p>';
  const body = viewSeg + (rows.length ? lakeDayBars(rows, 'days', sel) : '<p class="hint">Keine Einträge.</p>') + det;
  return hpanel('pin', 'Auf den Seen', sc, body, 'a-lakes');
}

/* Begleiter-Matrix: Begleiter in den Zeilen, See / Jahr / Monat in den Spalten; Zelle = Fische des Begleiters, klein darunter die gemeinsamen Tage */
function compMatrix(v) {
  const f = v === 'lake' ? { year: ui.year, month: ui.month, lake: '' } : v === 'years' ? { year: '', month: ui.month, lake: ui.lake } : { year: ui.year, month: '', lake: ui.lake };
  const base = applyFilter({ ...f, raw: true }).filter(t => t.comp.length);
  if (!base.length) return '<p class="hint">Keine Angeltage mit Begleitern.</p>';
  const per = v === 'lake' ? byLake(base).sort((a, b) => b.days - a.days).map(r => ({ l: r.lake, f: t => t.lake === r.lake }))
    : v === 'years' ? [...new Set(base.map(t => t.date.slice(0, 4)))].sort().reverse().map(y => ({ l: y, f: t => t.date.startsWith(y) }))
    : MONTHS.map((m, i) => ({ l: m, f: t => Number(t.date.slice(5, 7)) - 1 === i }));
  const all = { l: 'Gesamt', f: () => true };
  const people = [{ n: myName(), me: true }, ...byCompanion(base).rows.sort((a, b) => b.his - a.his).map(r => ({ n: r.name }))];
  const cell = (p, q) => { const ts = base.filter(q.f).filter(t => p.me || t.comp.some(c => c.name === p.n)); return { d: ts.length, h: sum(ts.map(t => p.me ? t.fish.length : sum(t.comp.filter(c => c.name === p.n).map(compN)))) }; };
  const mx = Math.max(1, ...people.flatMap(p => per.map(q => cell(p, q).h)));
  const td = (x, shade, me) => { if (!x.d) return '<td><span class="hmc cc empty">–</span></td>'; const al = shade ? Math.max(.14, x.h / mx * .88) : 0; return `<td><span class="hmc cc${al > .5 ? ' dk' : ''}${me ? ' me' : ''}" style="${shade ? 'background:rgba(' + (me ? '201,106,58,' : '11,107,114,') + al.toFixed(2) + ')' : ''}"><b>${hic('fish')}${x.h}</b><small>${hic('cal')}${x.d}</small></span></td>`; };
  let table;
  if (v === 'months') {
    const head = `<tr><th>Begleiter</th>${per.map(q => `<th class="n">${esc(q.l)}</th>`).join('')}<th class="n">Ges.</th></tr>`;
    const rows = people.map(p => `<tr${p.me ? ' class="merow"' : ''}><th scope="row">${esc(p.n)}</th>${per.map(q => td(cell(p, q), true, p.me)).join('')}${td(cell(p, all), false, p.me)}</tr>`).join('');
    table = `<table class="hm hmx" style="min-width:${84 + (per.length + 1) * 44}px"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
  } else {
    const head = `<tr><th>${v === 'lake' ? 'See' : 'Jahr'}</th>${people.map(p => `<th class="n${p.me ? ' mec' : ''}">${esc(p.n)}</th>`).join('')}</tr>`;
    const row = (q, shade) => `<tr${shade ? '' : ' class="totrow"'}><th scope="row">${esc(q.l)}</th>${people.map(p => td(cell(p, q), shade, p.me)).join('')}</tr>`;
    table = `<table class="hm hmx hml" style="min-width:${110 + people.length * 62}px"><thead>${head}</thead><tbody>${row(all, false)}${per.map(q => row(q, true)).join('')}</tbody></table>`;
  }
  const hint = v === 'lake' ? 'Zeigt die Seen im oben gewählten Jahr und Monat.' : v === 'years' ? (ui.year ? 'Der Jahresvergleich zeigt immer alle Jahre.' : '') : (ui.month ? 'Der Monatsvergleich zeigt immer alle Monate.' : '');
  return `<div class="stw">${table}</div><p class="hint">${hic('fish')}Große Zahl: Fische des Begleiters. ${hic('cal')}Kleine Zahl: gemeinsame Angeltage. Je dunkler, desto mehr Fische. Orange: ${myGen()} eigene Fische an Tagen mit Begleitern.${hint ? ' ' + hint : ''}</p>`;
}
/* Ich gegen …: nur gemeinsame Angeltage, pro Begleiter */
function compVs(trips) {
  const fu = d => Math.abs(Math.round(d * 10) / 10) === 1 ? 'Fisch' : 'Fische';
  const names = [...new Set(trips.flatMap(t => t.comp.map(c => c.name)))];
  if (!names.length) return '<p class="hint">Keine Angeltage mit Begleitern.</p>';
  const cards = names.map(name => {
    const ts = trips.filter(t => !t.planned && t.comp.some(c => c.name === name));
    const mine = ts.map(t => t.fish.length), his = ts.map(t => sum(t.comp.filter(c => c.name === name).map(compN)));
    const n = ts.length, M = sum(mine), H = sum(his);
    const win = mine.filter((v, i) => v > his[i]).length, lose = mine.filter((v, i) => v < his[i]).length, tie = n - win - lose;
    const mz = mine.filter(v => v === 0).length, hz = his.filter(v => v === 0).length;
    const dm = M / n, dh = H / n, diff = dm - dh;
    const verdict = Math.abs(diff) < 0.05 ? 'Gleichstand' : diff > 0 ? `${esc(myName()) + ' liegt'} vorn: ${fmtNum(diff, 1)} ${fu(diff)} mehr pro Tag` : `${esc(name)} liegt vorn: ${fmtNum(-diff, 1)} ${fu(diff)} mehr pro Tag`;
    const r = (lab, a, b, hiWins) => { const ca = (hiWins ? a > b : a < b) ? ' w' : '', cb = (hiWins ? b > a : b < a) ? ' w' : ''; return `<tr><th scope="row">${lab}</th><td class="n${ca}">${a}</td><td class="n${cb}">${b}</td></tr>`; };
    const table = `<div class="stw"><table class="st vs"><thead><tr><th></th><th class="n mec">${esc(myName())}</th><th class="n">${esc(name)}</th></tr></thead><tbody>`
      + r('Fische', M, H, true) + r('Ø pro Tag', fmtNum(dm, 1), fmtNum(dh, 1), true)
      + r('Tage vorn', win, lose, true) + `<tr><th scope="row">Gleichstand</th><td class="n" colspan="2">${tie} ${tie === 1 ? 'Tag' : 'Tage'}</td></tr>` + r('Ohne Fang', mz, hz, false) + '</tbody></table></div>';
    return { d: Math.abs(diff), html: `<div class="vsc"><h3>${esc(myName())} gegen ${esc(name)}</h3><p class="vsv">${verdict}</p><p class="sub">${n} gemeinsame ${n === 1 ? 'Angeltag' : 'Angeltage'}</p>${table}</div>` };
  });
  return '<p class="sub" style="margin-top:12px">Verglichen werden nur Tage, an denen beide zusammen angeln waren. Der Vergleich gilt für die oben gewählten Filter.</p>' + cards.map(c => c.html).join('');
}
function secCompNew(trips, sc) {
  const cv = ui.compV || 'list';
  const seg = `<div class="seg" role="group" aria-label="Ansicht">${[['list', 'Übersicht'], ['vs', myName() + ' gegen …'], ['lake', 'Nach See'], ['years', 'Nach Jahr'], ['months', 'Nach Monat']].map(([k, t]) => `<button type="button" data-act="cview" data-v="${k}" aria-pressed="${cv === k}">${t}</button>`).join('')}</div>`;
  if (cv === 'vs') return hpanel('people', 'Begleiter', sc, seg + compVs(trips), 'a-comp');
  if (cv !== 'list') return hpanel('people', 'Begleiter', sc, seg + compMatrix(cv), 'a-comp');
  const rows = byCompanion(trips).rows.sort((a, b) => b.his - a.his);
  const wc = trips.filter(t => t.comp.length);
  if (rows.length) rows.unshift({ name: myName(), me: true, days: wc.length, his: sum(wc.map(t => t.fish.length)), mine: sum(wc.map(t => t.fish.length)) });
  if (!rows.length) return hpanel('people', 'Begleiter', sc, seg + '<p class="hint">Keine Angeltage mit Begleitern.</p>');
  const max = Math.max(1, ...rows.map(r => r.his));
  const bars = seg + `<p class="sub" style="margin-top:12px">Fische, die der Begleiter gefangen hat. Orange: ${myGen()} eigene Fische an Tagen mit Begleitern.</p><div class="hb">${rows.map(r => `<div class="hbr${r.me ? ' me' : ''}"><span class="hbl">${esc(r.name)}<small>${r.me ? 'an ' + r.days + (r.days === 1 ? ' Tag' : ' Tagen') + ' mit Begl.' : r.days + ' gemeinsame ' + (r.days === 1 ? 'Angeltag' : 'Angeltage')}</small></span><span class="hbt"><i style="width:${r.his > 0 ? Math.max(2, r.his / max * 100) : 0}%"></i></span><b class="hbv">${r.his}</b></div>`).join('')}</div>`;
  return hpanel('people', 'Begleiter', sc, bars + stTbl([['Begleiter'], ['Gemeinsame Angeltage', 1], ['Fische des Begleiters', 1], [myGen() + ' Fische', 1]], rows.map(r => `<tr${r.me ? ' class="merow"' : ''}><td><b>${esc(r.name)}</b></td><td class="n">${r.days}</td><td class="n">${r.me ? '–' : r.his}</td><td class="n">${r.mine}</td></tr>`).join(''), ''), 'a-comp');
}

function secRec(trips, sc) {
  const order = n => n === 'Hecht' ? -2 : n === 'Barsch' ? -1 : 0;
  const sp = bySpecies(trips).sort((a, b) => order(a.name) - order(b.name) || b.n - a.n);
  const pick = (rows, f) => rows.reduce((m, y) => (!m || f(y) > f(m) || (f(y) === f(m) && y.date > m.date)) ? y : m, null);
  const long = sp.map(r => ({ r, x: pick(lf(r.rows), y => y.l) })).filter(h => h.x);
  const heavy = sp.map(r => ({ r, x: pick(r.rows.filter(y => y.w), y => y.w) })).filter(h => h.x);
  const go = x => `data-act="kpi" data-k="date" data-date="${x.date}"`, when = x => `<td class="nw">${esc(fmtDate(x.date))} <i class="go" aria-hidden="true">›</i></td>`;
  const lt = long.map(({ r, x }) => `<tr class="tap" ${go(x)}><td><b>${esc(r.name)}</b></td><td class="n">${fmtNum(x.l, 1)} cm</td><td class="n">${x.w ? fmtW(x.w) : '–'}</td><td>${esc(x.lake)}</td>${when(x)}</tr>`).join('');
  const ht = heavy.map(({ r, x }) => `<tr class="tap" ${go(x)}><td><b>${esc(r.name)}</b></td><td class="n">${fmtW(x.w)}</td><td class="n">${x.l != null ? fmtNum(x.l, 1) + ' cm' : '–'}</td><td>${esc(x.lake)}</td>${when(x)}</tr>`).join('');
  return hpanel('ruler', 'Längster Fisch je Art', sc, `<p class="sub">Nur ${myGen()} Fische. Eine Zeile antippen öffnet den Tag mit den Einträgen.</p>` + stTbl([['Art'], ['Länge', 1], ['Gewicht', 1], ['See'], ['Wann']], lt, 'Keine Fische eingetragen.', 'rec'), 'a-long')
    + (ht ? hpanel('scale', 'Schwerster Fisch je Art', sc, `<p class="sub">Nur ${myGen()} Fische. Eine Zeile antippen öffnet den Tag mit den Einträgen.</p>` + stTbl([['Art'], ['Gewicht', 1], ['Länge', 1], ['See'], ['Wann']], ht, '', 'rec')) : '')
    + hpanel('star', 'Beste Angeltage', sc, `<p class="sub">${whoLabel()}: die fünf Tage mit den meisten Fischen. Antippen öffnet den Tag.</p>${topDays(persp(trips))}`);
}

function secMore(trips, sc) {

  const tot = MONTHS.map((m, i) => { const S2 = summarize(trips.filter(t => Number(t.date.slice(5, 7)) - 1 === i)); return { label: m, value: S2.fish, sub: [S2.days + ' Tg.'], days: S2.days }; });
  return `<div class="panel" id="a-month" style="margin-top:16px"><h2>Fische pro Monat${sc}</h2><p class="sub">Alle gefangenen Fische je Monat.</p><div class="chart">${barChart(tot, { label: 'Fische nach Monat' })}</div></div><div class="grid2" style="margin-top:16px">

}

  el.innerHTML = filt + `<div style="margin-top:16px">${fn(trips, sc)}</div>` + printRow(['review', 'rec', 'years', 'lakes'], ui.year, ui.month);

function whoLabel() { return { me: myGen() + ' Fische', comp: 'Fische der Begleiter', all: 'Alle Fische (' + myGen() + ' und die der Begleiter)' }[whoNow()]; }
function whoNote() { return { me: myGen() + ' Fänge, ohne die der Begleiter.', comp: 'Nur die Fänge der Begleiter, an Tagen mit Begleitern. Länge und Gewicht werden bei Begleitern nicht erfasst.', all: myGen() + ' Fänge und die der Begleiter zusammen. Längen und Gewichte stammen nur aus den Fängen von ' + myName() + '.' }[whoNow()]; }
function topDays(trips) {
  const w = whoNow();
  const rows = [...trips].filter(t => t.fish.length > 0).sort((a, b) => b.fish.length - a.fish.length || b.date.localeCompare(a.date)).slice(0, 5);
  if (!rows.length) return '<p class="sub">Noch kein Tag mit Fang.</p>';
  const cnt = fl => { const g = {}; fl.forEach(x => { g[x.s] = (g[x.s] || 0) + 1; }); return Object.entries(g).map(([k, v]) => v + ' ' + esc(k)).join(', '); };
  const compLines = t => t.comp.map(c => { const n = compN(c); return `<p class="sub">${esc(c.name)}: ${n ? Object.entries(c.c || {}).filter(([, v]) => v).map(([k, v]) => v + ' ' + esc(k)).join(', ') : 'ohne Fang'}</p>`; }).join('');
  return rows.map(t => {
    const own = t._own || t.fish;
    const who = w === 'me' ? `<p>${cnt(t.fish)}</p>` : w === 'comp' ? compLines(t) : `<p>${esc(myName())}: ${own.length ? cnt(own) : 'ohne Fang'}</p>` + compLines(t);
    return `<div class="trip tap" data-act="kpi" data-k="date" data-date="${t.date}"><div class="trip-h"><b>${fmtDate(t.date)}</b><span class="lake">${esc(t.lake)}</span><span class="pill">${t.fish.length} ${t.fish.length === 1 ? 'Fisch' : 'Fische'}</span><i class="go" aria-hidden="true">›</i></div>${who}</div>`;
  }).join('');
}

/* ===== Fotos (verkleinert, in IndexedDB; eigene Fotosicherung) ===== */
let photosOK = false, idb = null;
const KIND = { get ich() { return myName(); }, fische: 'Fische', sonst: 'Foto' };

function openPhotoDb() {
  return new Promise(res => {
    try {
      const rq = indexedDB.open('angelbuch-photos', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('p', { keyPath: 'id' });
      rq.onsuccess = () => { idb = rq.result; photosOK = true; res(true); };
      rq.onerror = () => res(false);
      rq.onblocked = () => res(false);
    } catch (e) { res(false); }
  });
}
const idbReq = (mode, fn) => new Promise((res, rej) => {
  if (!idb) return rej(new Error('nodb'));
  const tx = idb.transaction('p', mode), r = fn(tx.objectStore('p'));
  tx.oncomplete = () => res(r && r.result);
  tx.onerror = () => rej(tx.error);
  tx.onabort = () => rej(tx.error);
});
const photoPut = rec => idbReq('readwrite', s => s.put(rec));
const photoGet = id => idbReq('readonly', s => s.get(id));
const photoDel = id => idbReq('readwrite', s => s.delete(id));
const photoAll = () => idbReq('readonly', s => s.getAll());
const photoKeys = () => idbReq('readonly', s => s.getAllKeys());

function loadImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}
function scaled(im, max, q) {
  const w0 = im.naturalWidth || im.width, h0 = im.naturalHeight || im.height, k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w0 * k)); c.height = Math.max(1, Math.round(h0 * k));
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function compressImage(file) {
  const im = await loadImg(file);
  return { data: scaled(im, 1280, 0.72), thumb: scaled(im, 320, 0.7) };
}
async function addPhotoFile(file) {
  showErr('e-photomsg', '');
  try {
    const { data, thumb } = await compressImage(file);
    const id = uid();
    await photoPut({ id, data, thumb, created: new Date().toISOString() });
    draft.photos.push({ id, kind: ui.photoKind || 'sonst' });
    draft.addedPhotos.push(id);
    keepLen(renderEntry);
  } catch (e) {
    showErr('e-photomsg', 'Das Foto konnte nicht gelesen oder gespeichert werden. Bitte ein anderes Foto (JPEG) wählen.');
  }
}
function discardDraftPhotos() { (draft.addedPhotos || []).forEach(id => photoDel(id).catch(() => { })); }

/* Vorschaubilder nachladen, sobald sie im DOM erscheinen */
function hydratePhotos() {
  if (!photosOK) return;
  document.querySelectorAll('img[data-pid]:not([src]):not([data-miss])').forEach(im => {
    photoGet(im.dataset.pid).then(r => {
      if (r) im.src = r.thumb || r.data; else { im.dataset.miss = '1'; im.classList.add('missing'); im.alt = 'Foto fehlt auf diesem Gerät'; }
    }, () => { });
  });
}
function openLightbox(pid, kind) {
  photoGet(pid).then(r => {
    if (!r) { toast('Dieses Foto ist auf diesem Gerät nicht vorhanden. Fotosicherung laden.'); return; }
    $('lb-img').src = r.data; $('lb-img').alt = 'Foto: ' + (KIND[kind] || 'Foto'); $('lb-cap').textContent = KIND[kind] || 'Foto';
    $('lb').hidden = false;
  }, () => { });
}
function closeLightbox() { const l = $('lb'); if (l) { l.hidden = true; $('lb-img').removeAttribute('src'); } }

async function updatePhotoStat() {
  const el = $('ph-stat'); if (!el || !photosOK) return;
  try {
    const all = await photoAll();
    const bytes = all.reduce((a, r) => a + (r.data ? r.data.length : 0) + (r.thumb ? r.thumb.length : 0), 0);
    el.textContent = all.length + (all.length === 1 ? ' Foto' : ' Fotos') + ' auf diesem Gerät, etwa ' + fmtNum(bytes / 1048576, 1) + ' MB.';
  } catch (e) { el.textContent = 'Fotos konnten nicht gezählt werden.'; }
}
async function photoBackup() {
  const msg = $('ph-msg');
  try {
    const all = await photoAll();
    if (!all.length) { toast('Es gibt noch keine Fotos.'); return; }
    const data = JSON.stringify({ app: 'angelbuch-fotos', v: 1, exportedAt: new Date().toISOString(), photos: all });
    const name = `angelbuch-fotos-${todayStr()}.json`;
    if (!dl) {
      const r = await shareFile(name, data, 'application/json');
      if (r === 'shared') { store.lastPhotoBackup = new Date().toISOString(); store.photoChanges = 0; saveStore(); renderBanners(); renderData(); toast('Bitte prüfen, ob die Fotosicherung in „Dateien“ gelandet ist.', 6000); return; }
      if (r === 'cancelled') { toast('Nicht gespeichert'); return; }
      if (r === 'notallowed') { ui.pendingShare = { name, data }; renderData(); toast('Bitte jetzt auf „Fotosicherung jetzt teilen“ tippen.', 6000); return; }
      tryAnchor(name, data, 'application/json');
      if (msg) { msg.hidden = false; msg.textContent = 'Der Browser hat keine Datei angeboten. Bitte Safari aktualisieren oder die Fotos einzeln aus der Fotos-App sichern.'; }
      return;
    }
    await dl.save({ filename: name, data: new Blob([data], { type: 'application/json' }) });
    store.lastPhotoBackup = new Date().toISOString(); store.photoChanges = 0; saveStore(); renderBanners(); renderData();
    toast('Fotosicherung gespeichert. Bitte in iCloud Drive ablegen.');
  } catch (e) { if (!(e && e.code === 'declined')) toast('Fotosicherung hat nicht geklappt (' + ((e && e.code) || 'Fehler') + ')'); }
}
function photoRestore(file) {
  const msg = $('ph-msg'), rd = new FileReader();
  rd.onload = async () => {
    try {
      const o = JSON.parse(String(rd.result));
      if (!o || !Array.isArray(o.photos)) throw new Error('format');
      const have = new Set(await photoKeys());
      let n = 0;
      for (const p of o.photos) if (p && p.id && p.data && !have.has(p.id)) { await photoPut({ id: p.id, data: p.data, thumb: p.thumb || p.data, created: p.created || '' }); n++; }
      toast(n + (n === 1 ? ' Foto' : ' Fotos') + ' wiederhergestellt'); renderData(); hydratePhotos();
    } catch (e) { if (msg) { msg.hidden = false; msg.className = 'msg bad'; msg.textContent = 'Die Datei ist keine gültige Fotosicherung.'; } }
  };
  rd.readAsText(file);
}
function deleteTripPhotos(trips) { trips.forEach(t => (t.photos || []).forEach(p => photoDel(p.id).catch(() => { }))); }
function photoBackupDue() {
  const n = store.photoChanges || 0; if (!n) return false;
  if (n >= 20) return true;
  return store.lastPhotoBackup ? daysSince(store.lastPhotoBackup) > 30 : n >= 3;
}

function sharePending() {
  const p = ui.pendingShare; if (!p) return;
  shareFile(p.name, p.data, 'application/json').then(r => {
    if (r === 'shared') { ui.pendingShare = null; store.lastPhotoBackup = new Date().toISOString(); store.photoChanges = 0; saveStore(); renderBanners(); renderData(); toast('Bitte prüfen, ob die Fotosicherung in „Dateien“ gelandet ist.', 6000); }
    else if (r === 'cancelled') toast('Nicht gespeichert');
    else { tryAnchor(p.name, p.data, 'application/json'); toast('Der Browser hat keine Datei angeboten.'); }
  });
}

/* --- Jahresrückblick: gestaltete A4-Seite zum Ansehen und Drucken --- */
function printReviewHtml(year) {

  const rank = yrs.map(x => [x, summarize(all.filter(t => t.date.startsWith(x))).fish]).sort((a, b) => b[1] - a[1]).findIndex(r => r[0] === y) + 1;
  const prevY = String(Number(y) - 1), pt = all.filter(t => t.date.startsWith(prevY)), P = summarize(pt);
  const sentence = yrs.length > 1 && rank === 1 ? `${y} war ${{ me: 'dein fischreichstes Jahr', comp: 'das fischreichste Jahr der Begleiter', all: 'euer fischreichstes Jahr' }[whoNow()]}.` : yrs.length > 1 ? `Platz ${rank} von ${yrs.length} Jahren bei den Fängen.` : '';
  /* Monatsbalken */
  const per = Array.from({ length: 12 }, (_, i) => { const ts = trips.filter(t => Number(t.date.slice(5, 7)) === i + 1); return { n: ts.reduce((a, t) => a + t.fish.length, 0), days: ts.length, segs: bySpecies(ts).map(s => ({ name: s.name, v: s.n })) }; });
  const mx = Math.max(1, ...per.map(m => m.n)), H = 150, bw = 38, gap = 14, W = 12 * (bw + gap) + gap;
  const bars = per.map((m, i) => { let yy = H + 20; const x = gap + i * (bw + gap); const segs = m.segs.map(sg => { const h = sg.v / mx * H; yy -= h; return `<rect x="${x}" y="${yy.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3" style="fill:${speciesColor(sg.name)}"/>`; }).join('');
    return segs + (m.n ? `<text x="${x + bw / 2}" y="${(H + 16 - m.n / mx * H).toFixed(1)}" text-anchor="middle" class="rv-v">${m.n}</text>` : '') + `<text x="${x + bw / 2}" y="${H + 38}" text-anchor="middle" class="rv-l">${MONTHS[i]}</text>`; }).join('');
  const chart = `<svg class="rv-chart" viewBox="0 0 ${W} ${H + 46}" role="img" aria-label="Fische pro Monat">${bars}<line x1="0" y1="${H + 20}" x2="${W}" y2="${H + 20}" stroke="#9BB"/></svg>`;
  const legend = `<div class="rv-leg">${sp.map(s => `<span><i style="background:${speciesColor(s.name)}"></i>${esc(s.name)}</span>`).join('')}</div>`;
  /* Highlights */
  const bestDay = [...trips].sort((a, b) => b.fish.length - a.fish.length)[0];
  const lk = byLake(trips)[0], cp = byCompanion(printTrips(true).filter(t => t.date.startsWith(y))).rows[0];
  const hl = [];
  if (S.best) hl.push(['Größter Fang', esc(S.best.s) + ' · ' + fmtNum(S.best.l, 1) + ' cm', (S.best.w ? fmtW(S.best.w) + ' · ' : '') + esc(S.best.lake) + ', ' + esc(shortDate(S.best.date))]);
  if (bestDay && bestDay.fish.length) hl.push(['Fischreichster Tag', pvS(bestDay.fish.length, 'Fisch', 'Fische'), esc(bestDay.lake) + ', ' + esc(shortDate(bestDay.date))]);
  if (lk && lk.fish) hl.push(['Lieblingsgewässer', esc(lk.lake), pvS(lk.fish, 'Fisch', 'Fische') + ' an ' + pvS(lk.days, 'Angeltag', 'Angeltagen')]);
  if (cp) hl.push(['Treuester Begleiter', esc(cp.name), pvS(cp.days, 'gemeinsamer Angeltag', 'gemeinsame Angeltage') + ' · ' + pvS(cp.his, 'Fisch', 'Fische') + ' von ' + esc(cp.name)]);
  const hlHtml = hl.length ? `<div class="rv-hl">${hl.map(([c, b, s]) => `<div class="rl-card"><div class="rl-cap">${c}</div><div class="rv-hb">${b}</div><div class="rl-m">${s}</div></div>`).join('')}</div>` : '';
  /* Arten */
  const spMax = Math.max(1, ...sp.map(s => s.n));
  const spHtml = sp.length ? `<div class="rv-sp">${sp.map(s => `<div class="rv-sr"><span>${esc(s.name)}</span><div class="rl-bar"><i style="width:${Math.max(2, s.n / spMax * 100)}%;background:${speciesColor(s.name)}"></i></div><b>${s.n}</b><small>${s.avg != null && s.best ? 'Ø ' + fmtNum(s.avg, 1) + ' cm · max ' + fmtNum(s.best.l, 1) + ' cm' : ''}</small></div>`).join('')}</div>` : '';
  /* Rekorde des Jahres */
  const fl = recFlags(), recs = trips.filter(t => fl.has(t.id)).sort((a, b) => a.date.localeCompare(b.date)).flatMap(t => fl.get(t.id).map(r => { const l = recLine(r); return `<li><span>${esc(shortDate(t.date))}</span><b>${esc(l.h)}</b><em>${esc(l.d)}</em></li>`; }));
  const recHtml = recs.length && whoNow() === 'me' ? `<h2 class="rl-h2">Bestmarken in ${esc(y)}</h2><ul class="rv-rec">${recs.join('')}</ul>` : '';

  const running = y === todayStr().slice(0, 4);

}

  const ts = store.trips.filter(t => !t.planned && t.date.startsWith(g.year) && (!g.lake || t.lake === g.lake));
  const fish = ts.flatMap(t => t.fish).filter(f => !g.sp || f.s === g.sp);
  const cur = g.type === 'days' ? ts.length : g.type === 'fish' ? fish.length : g.type === 'len' ? Math.max(0, ...fish.map(f => f.l || 0)) : Math.max(0, ...fish.map(f => f.w || 0));

function backupJson() { return JSON.stringify({ app: 'angelbuch', v: 2, exportedAt: new Date().toISOString(), species: store.species, lists: store.lists, geo: store.geo || {}, goals: (store.goals || []).filter(g => !g.demo), myName: store.myName || '', trips: realTrips(), trash: store.trash || [] }, null, 1); }
function csvText() {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['Datum', 'Wochentag', 'Gewässer', 'Beginn', 'Ende', 'Art', 'Länge_cm', 'Gewicht_g', 'Begleiter', 'Köder', 'Wetter', 'Temperatur', 'Notiz']];
  for (const t of [...realTrips()].sort((a, b) => a.date.localeCompare(b.date))) {
    const comp = t.comp.map(c => c.name + ': ' + (Object.entries(c.c || {}).map(([k, v]) => {
      const z = compSizes(c, k), sz = SIZES.map(([s, l]) => z[s] ? z[s] + ' ' + l : '').filter(Boolean).join(', ');
      return v + ' ' + k + (sz ? ' (' + sz + ')' : '');
    }).join(', ') || 'ohne Fang')).join(' | ');
    const base = [t.date, WD[wdIndex(t.date)], t.lake, t.time || '', t.timeEnd || ''];
    const tail = [comp, t.baits.join(', '), t.weathers.join(', '), (t.temps || []).join(', '), t.note || ''];
    if (!t.fish.length) rows.push([...base, '', '', '', ...tail]);
    else t.fish.forEach((x, i) => rows.push([...base, x.s, x.l == null ? '' : String(x.l).replace('.', ','), x.w || '', ...(i ? ['', '', '', '', ''] : tail)]));
  }
  return '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n');
}
function tryAnchor(name, data, mime) {
  try {
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { }
}
async function shareFile(name, data, mime) {
  try {
    const f = new File([data], name, { type: mime });
    if (!(navigator.share && navigator.canShare && navigator.canShare({ files: [f] }))) return 'unsupported';
    await navigator.share({ files: [f], title: name });
    return 'shared';
  } catch (e) { return e && e.name === 'AbortError' ? 'cancelled' : e && e.name === 'NotAllowedError' ? 'notallowed' : 'error'; }
}
function markBackup() { store.lastBackup = new Date().toISOString(); store.changes = 0; saveStore(); renderBanners(); }
async function fallbackSave(name, data, isJson) {
  const mime = isJson ? 'application/json' : 'text/csv';
  const r = await shareFile(name, data, mime);
  if (r === 'shared') { if (isJson) { markBackup(); renderData(); } toast('Bitte prüfen, ob die Datei in „Dateien“ (zum Beispiel iCloud Drive) gelandet ist.', 6000); return; }
  if (r === 'cancelled') { toast('Nicht gespeichert'); return; }
  tryAnchor(name, data, mime);
  ui.fallback = { name, data, isJson };
  renderData();
  toast('Falls keine Datei angeboten wurde: Text unter „Sicherung“ kopieren.', 6000);
}
async function doSave(kind) {
  const isJson = kind === 'json', stamp = todayStr();
  const data = isJson ? backupJson() : csvText();
  const name = isJson ? `angelbuch-sicherung-${stamp}.json` : `angelbuch-tabelle-${stamp}.csv`;
  if (!dl) { fallbackSave(name, data, isJson); return; }
  try {
    await dl.save({ filename: name, data });
    ui.fallback = null;
    if (isJson) { store.lastBackup = new Date().toISOString(); store.changes = 0; saveStore(); renderBanners(); renderData(); }
    toast(isJson ? 'Sicherung gespeichert. Bitte in iCloud Drive ablegen.' : 'Tabelle gespeichert');
  } catch (e) {
    if (e && e.code === 'declined') toast('Nicht gespeichert');
    else fallbackSave(name, data, isJson);
  }
}

function readBackup(text) {
  const o = JSON.parse(text);
  if (!o || !Array.isArray(o.trips) || !Array.isArray(o.species)) throw new Error('format');
  const trips = o.trips.filter(t => t && typeof t.date === 'string' && typeof t.lake === 'string').map(normalizeTrip);
  const L = o.lists && typeof o.lists === 'object' ? o.lists : {};
  const arr = a => Array.isArray(a) ? a.filter(x => typeof x === 'string' && x.trim()) : [];
  return {
    species: o.species.filter(s => s && s.name), trips,
    lists: { lakes: arr(L.lakes), baits: arr(L.baits), weathers: arr(L.weathers), temps: arr(L.temps) },
    geo: o.geo && typeof o.geo === 'object' && !Array.isArray(o.geo) ? Object.fromEntries(Object.entries(o.geo).filter(([k, g]) => g && Number.isFinite(g.lat) && Number.isFinite(g.lon)).map(([k, g]) => [k, { lat: g.lat, lon: g.lon, name: String(g.name || k) }])) : {},
    myName: typeof o.myName === 'string' ? o.myName.trim().slice(0, 30) : '',
    goals: Array.isArray(o.goals) ? o.goals.map(g => normGoal(g && { ...g, demo: false })).filter(Boolean) : [],
    trash: Array.isArray(o.trash) ? o.trash.filter(t => t && t.date && t.lake && Array.isArray(t.fish) && t.deletedAt).map(normalizeTrip) : []
  };
}
function applyImport(mode) {
  const p = ui.pending; if (!p) return;
  if (mode === 'replace') {
    store.species = p.species.length ? p.species : store.species; store.trips = p.trips; store.trash = p.trash;
    store.lists = { lakes: [...p.lists.lakes], baits: [...p.lists.baits], weathers: [...p.lists.weathers], temps: [...p.lists.temps] };
    store.geo = { ...p.geo };
    store.goals = [...p.goals]; store.myName = p.myName || '';
  } else {
    const have = new Set(store.trips.map(t => t.id));
    for (const s of p.species) if (!store.species.some(x => x.name === s.name)) store.species.push(s);
    for (const t of p.trips) if (!have.has(t.id)) store.trips.push(t);
    store.geo = { ...p.geo, ...(store.geo || {}) };
    if (!store.myName && p.myName) store.myName = p.myName;
    { const gh = new Set((store.goals || []).map(g => g.id)); store.goals = [...(store.goals || []), ...p.goals.filter(g => !gh.has(g.id))]; }
    const inTrash = new Set((store.trash || []).map(t => t.id));
    for (const t of p.trash) if (!have.has(t.id) && !inTrash.has(t.id)) (store.trash = store.trash || []).push(t);
    for (const [k, key] of Object.entries({ lakes: 'lakes', baits: 'baits', weathers: 'weathers', temps: 'temps' })) store.lists[key] = mergeNames(store.lists[key] || [], p.lists[k]);

}
